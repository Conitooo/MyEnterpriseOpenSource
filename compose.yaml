services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: myenterpriseos
      MYSQL_USER: myenterpriseos
      MYSQL_PASSWORD: local-dev-db-only
      MYSQL_ROOT_PASSWORD: local-dev-root-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/myenterpriseos
      SPRING_DATASOURCE_USERNAME: myenterpriseos
      SPRING_DATASOURCE_PASSWORD: local-dev-db-only
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.local:/app/.local
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
