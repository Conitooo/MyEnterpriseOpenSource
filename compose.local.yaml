services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: myenterpriseos
      MYSQL_USER: myenterpriseos
      MYSQL_PASSWORD: local-dev-db-only
      MYSQL_ROOT_PASSWORD: local-dev-root-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
