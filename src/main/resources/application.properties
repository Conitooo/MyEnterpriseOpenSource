spring.application.name=MyEnterpriseOpenSource
spring.profiles.default=local
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jpa.show-sql=false
app.security.jwt.issuer=${JWT_ISSUER:https://local.myenterpriseos.invalid}
app.security.bootstrap.enabled=${APP_SECURITY_BOOTSTRAP_ENABLED:false}
logging.file.name=${APP_LOG_FILE:logs/backend.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
