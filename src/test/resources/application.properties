spring.datasource.url=jdbc:h2:mem:enterprise_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.profiles.active=test
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
app.security.jwt.issuer=https://test.myenterpriseos.local
app.security.jwt.private-key-location=classpath:jwt-test-private.pem
app.security.jwt.public-key-location=classpath:jwt-test-public.pem
